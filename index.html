<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<base href="/3d/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣此刻 · dalta 情報站</title>
<meta name="description" content="立體的台灣：天氣、地震、房價、車流，和從海外流進來的錢。">
<meta name="theme-color" content="#000000">
<style>
:root{
  --bg:#000;--fg:#f5f5f7;--fg2:#a1a1a6;--fg3:#6e6e73;--line:rgba(255,255,255,.12);
  --glass:rgba(29,29,31,.62);--glass2:rgba(44,44,46,.55);--blue:#0071e3;--blue2:#2997ff;
  --up:#30d158;--down:#ff453a;--warn:#ffd60a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--blue2);text-decoration:none}
a:hover{text-decoration:underline}
@media (max-width:760px){#stage,#ihud,#leaderSvg{bottom:auto!important;height:100lvh!important}}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 35%,#101216 0%,#050506 55%,#000 100%)}
canvas{display:block}

/* 導覽列 */
nav{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-left));z-index:20;
  background:rgba(22,22,23,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;letter-spacing:.01em}
nav .brand{font-weight:600;font-size:14px;color:var(--fg)}
nav .brand span{color:var(--fg2);font-weight:400;margin-left:6px}
nav .right{display:flex;gap:18px;align-items:center;color:var(--fg2)}
nav .right a{color:var(--fg2)}
nav .right a:hover{color:var(--fg);text-decoration:none}

/* 開場 */
#hero{position:fixed;top:88px;left:0;right:0;text-align:center;z-index:10;transition:opacity .9s ease,transform .9s ease;pointer-events:none}
#hero h1{font-size:clamp(40px,7vw,80px);font-weight:600;letter-spacing:-.015em;line-height:1.05}
#hero p{font-size:clamp(17px,2.1vw,24px);color:var(--fg2);margin-top:10px;font-weight:400;letter-spacing:.005em}
#hero .when{font-size:13px;color:var(--fg3);margin-top:14px;letter-spacing:.04em}
#hero .ctas{display:flex;gap:14px;justify-content:center;margin-top:22px;pointer-events:auto}
.pill{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 22px;border-radius:980px;font-size:15px;font-family:var(--font);cursor:pointer;border:1px solid transparent;transition:background .2s,color .2s,border-color .2s}
.pill.primary{background:var(--blue);color:#fff}
.pill.primary:hover{background:#0077ed;text-decoration:none}
.pill.ghost{background:transparent;color:var(--blue2);border-color:var(--blue2)}
.pill.ghost:hover{background:var(--blue2);color:#fff;text-decoration:none}
body.exploring #hero{opacity:0;transform:translateY(-24px)}
body.exploring #hero .ctas{pointer-events:none}

/* 圖層說明 */
#caption{position:fixed;left:max(16px,env(safe-area-inset-left));top:64px;z-index:10;max-width:440px;padding:12px 16px 14px;border-radius:18px;background:rgba(10,10,12,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
body.exploring #caption{opacity:1;transform:none}
#caption .eyebrow{font-size:12px;color:var(--fg3);letter-spacing:.08em}
#caption h2{font-size:32px;font-weight:600;letter-spacing:-.01em;margin-top:4px}
#caption .stat{font-size:15px;color:var(--fg2);margin-top:8px;line-height:1.55}
#caption .stat b{color:var(--fg);font-weight:600}
#caption .src{font-size:11px;color:var(--fg3);margin-top:10px}

/* 底部圖層切換 */
#dock{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:15;display:flex;gap:2px;padding:4px;border-radius:980px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--line);opacity:0;transition:opacity .6s ease .2s,transform .6s ease .2s;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
body.exploring #dock{opacity:1;transform:translate(-50%,0)}
#dock button{all:unset;cursor:pointer;font-size:14px;color:var(--fg2);padding:9px 18px;border-radius:980px;white-space:nowrap;transition:background .25s,color .25s}
#dock button:hover{color:var(--fg)}
#dock button.on{background:rgba(255,255,255,.14);color:var(--fg)}

/* 縣市卡片 */
#card{position:fixed;right:max(24px,env(safe-area-inset-right));top:72px;width:340px;max-height:calc(100vh - 160px);overflow:auto;z-index:16;padding:20px 20px 16px;border-radius:22px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);border:1px solid var(--line);
  opacity:0;transform:translateX(16px);pointer-events:none;transition:opacity .35s ease,transform .35s ease}
#card.show{opacity:1;transform:none;pointer-events:auto}
#card .x{all:unset;position:absolute;right:12px;top:10px;z-index:2;cursor:pointer;color:var(--fg2);font-size:22px;line-height:1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08)}
#card .x:hover{color:var(--fg);background:rgba(255,255,255,.16)}
#card h3{font-size:24px;font-weight:600;padding-right:40px}
#card .sub{font-size:13px;color:var(--fg2);margin-top:2px}
#card .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
#card .kv{background:var(--glass2);border-radius:14px;padding:10px 12px}
#card .kv .k{font-size:11px;color:var(--fg3);letter-spacing:.04em}
#card .kv .v{font-size:20px;font-weight:600;margin-top:2px}
#card .kv .v small{font-size:12px;font-weight:400;color:var(--fg2);margin-left:2px}
#card .sec{font-size:12px;color:var(--fg3);margin:16px 0 6px;letter-spacing:.06em}
#card ul{list-style:none}
#card li{font-size:14px;line-height:1.45;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
#card li .m{display:block;font-size:11px;color:var(--fg3);margin-top:2px}
#card .tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:980px;background:rgba(255,214,10,.15);color:var(--warn);margin:4px 6px 0 0}
#card .more{display:block;margin-top:14px;font-size:14px}

/* 地圖上的標籤 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;color:var(--fg);transition:opacity .4s;text-align:center;line-height:1.3;padding:3px 8px;border-radius:9px;background:rgba(20,20,22,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08)}
.lbl .n{font-size:11px;color:var(--fg2)}
.lbl.big{font-size:14px;font-weight:600}
.lbl.pillv{font-size:13px;font-weight:600}
.lbl.flow{font-size:13px;padding:6px 10px;border-radius:12px}
.lbl.flow .n{display:block}
.up{color:var(--up)!important}.down{color:var(--down)!important}

#hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);font-size:12px;color:var(--fg3);z-index:9;opacity:0;transition:opacity .6s ease 1s;pointer-events:none;white-space:nowrap}
body.exploring #hint{opacity:1}
#tip{position:fixed;z-index:25;pointer-events:none;padding:8px 12px;border-radius:12px;background:rgba(20,20,22,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);font-size:13px;line-height:1.4;opacity:0;transition:opacity .15s;max-width:260px}
#tip.show{opacity:1}#tip b{display:block;font-weight:600}#tip span{color:var(--fg2)}
#credit{position:fixed;right:12px;bottom:8px;font-size:10px;color:var(--fg3);z-index:9;opacity:.7;pointer-events:none}
@media (max-width:760px){#credit{display:none}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:#000;transition:opacity .8s ease;font-size:13px;color:var(--fg3);letter-spacing:.08em}
#load.done{opacity:0;pointer-events:none}
#fallback{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px;z-index:40;background:#000}

@media (max-width:760px){
  #hero{top:72px;padding:0 20px}
  #hero p{font-size:15px;text-wrap:balance}
  #caption{left:16px;right:16px;max-width:none;top:56px}
  #caption h2{font-size:24px}
  #caption .stat{font-size:13px}
  #card{left:8px;right:8px;width:auto;top:auto;bottom:84px;max-height:52vh;border-radius:20px;transform:translateY(16px)}
  #hint{display:none}
  nav .right .hide-s{display:none}
}
/* 捲動劇本：文字在左、台灣在中間、圖表在右 */
html,body{height:auto;overflow:visible}
html{overflow-x:clip}
#hero,#dock,#caption,#hint{display:none!important}
#story{position:relative;z-index:12;pointer-events:none}
.ch{height:135vh;position:relative}
.ch.last{height:100vh}
.ch .card{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.ch.act .card{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.ch .card{transition:none}}
.ch .card{position:sticky;top:24vh;margin-left:max(24px,5vw);width:min(440px,calc(100vw - 48px));pointer-events:auto;display:flex;flex-direction:column;gap:12px;text-shadow:0 1px 18px rgba(0,0,0,.55)}
body.storying::before{content:"";position:fixed;inset:0;z-index:11;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.74) 0%,rgba(0,0,0,.42) 28%,rgba(0,0,0,0) 52%)}
.ch .eyebrow{font-size:12px;color:#8e8e93;letter-spacing:.08em}
.ch h1{font-size:clamp(46px,6.6vw,88px);font-weight:700;letter-spacing:-.02em;line-height:1.02}
.ch h2{word-break:keep-all;font-size:clamp(32px,3.6vw,50px);font-weight:700;letter-spacing:-.015em;line-height:1.12}
.ch p{font-size:17px;line-height:1.65;color:#c7c7cc}
.ch .lede{font-size:clamp(19px,1.9vw,23px);color:#f5f5f7;font-weight:500}
.ch .why{font-size:13.5px;color:#8e8e93;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
.ch .why b{display:block;color:#c7c7cc;font-weight:500;margin-bottom:2px}
.ch.hero .card{top:12vh;width:min(600px,calc(100vw - 48px))}
.ch .toc{list-style:none;display:flex;flex-direction:column;margin-top:10px;border-top:1px solid rgba(255,255,255,.14)}
.ch .toc li{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px}
.ch .toc .n{font-size:12px;color:#6e6e73;font-variant-numeric:tabular-nums}
.ch .toc .c{font-size:12px;color:#8e8e93}
.ch .toc .t{font-weight:600;color:#f5f5f7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .toc .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ch .scrollhint{font-size:12px;color:#8e8e93;letter-spacing:.12em;margin-top:16px;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(6px);opacity:1}}
.ch .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.ch.last .card{top:auto;position:absolute;bottom:170px}

/* 圖表面板 */
#side{position:fixed;z-index:13;right:max(24px,4vw);top:50%;width:min(360px,30vw);transform:translate(16px,-50%);opacity:0;pointer-events:none;
  padding:20px 20px 16px;border-radius:24px;background:rgba(22,22,24,.62);backdrop-filter:saturate(170%) blur(26px);-webkit-backdrop-filter:saturate(170%) blur(26px);
  border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.45);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;max-height:72vh;overflow:auto}
#side.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#side .se{font-size:11px;color:#8e8e93;letter-spacing:.08em}
#side .st{font-size:17px;font-weight:600;color:#f5f5f7;margin-top:3px;line-height:1.35}
#side .sb{font-size:34px;font-weight:700;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
#side .sb small{font-size:14px;font-weight:500;color:#8e8e93;margin-left:8px}
#side .chart{width:100%;height:auto;display:block;overflow:visible}
#side .chart .grid{stroke:rgba(255,255,255,.08);stroke-dasharray:2 4}
#side .chart .ax{fill:#6e6e73;font-size:10px;font-family:var(--font);font-variant-numeric:tabular-nums}
#side .chart .dot{animation:pop .5s .9s both cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
#side .chart .dot{transform-box:fill-box;transform-origin:center}
#side .bars{display:flex;flex-direction:column;gap:7px}
#side .bar{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
#side .bn{color:#c7c7cc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .bt{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
#side .bt i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#side .bv{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
#side .lst{list-style:none;display:flex;flex-direction:column}
#side .lst li{font-size:13.5px;line-height:1.45;color:#f5f5f7;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
#side .lst li:first-child{border-top:0}
#side .lst li span{display:block;font-size:11.5px;color:#8e8e93;margin-top:2px}
#side .lst a{color:#f5f5f7}
#side .sf{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:#6e6e73;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
#side .empty{font-size:13px;color:#8e8e93}
@media (prefers-reduced-motion:reduce){#side .bt i,#side .chart .dot,.ch .scrollhint{animation:none}}
#leaderSvg{position:fixed;inset:0;width:100%;height:100%;z-index:12;pointer-events:none}
#leaderG{transition:opacity .4s}
#leader{stroke:rgba(255,255,255,.55);stroke-width:1}
#leaderDot{fill:#fff}

/* 自己逛：分類＋項目（像 iOS 的分段控制） */
#dock2{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,24px);z-index:15;display:flex;flex-direction:column;align-items:center;gap:10px;
  opacity:0;pointer-events:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1);width:min(760px,calc(100vw - 24px))}
body.exploring #dock2{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dock2 .seg{position:relative;display:flex;gap:0;padding:4px;border-radius:980px;background:rgba(36,36,38,.66);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.1);max-width:100%;overflow-x:auto;scrollbar-width:none}
#dock2 .seg::-webkit-scrollbar,#dock2 .chips::-webkit-scrollbar{display:none}
#dock2 .seg button{all:unset;position:relative;z-index:1;cursor:pointer;font-size:14px;font-weight:500;color:#a1a1a6;padding:9px 18px;border-radius:980px;white-space:nowrap;transition:color .3s}
#dock2 .seg button[aria-selected="true"]{color:#1d1d1f}
#dock2 .seg .hl{position:absolute;left:4px;top:4px;bottom:4px;border-radius:980px;background:#f5f5f7;transition:transform .45s cubic-bezier(.3,.9,.3,1),width .45s cubic-bezier(.3,.9,.3,1);box-shadow:0 2px 8px rgba(0,0,0,.25)}
#dock2 .chips{display:flex;gap:8px;max-width:100%;overflow-x:auto;padding:2px 6px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
#dock2 .chips.in button{animation:chip .5s cubic-bezier(.2,.8,.2,1) both}
#dock2 .chips.in button:nth-child(2){animation-delay:.03s}#dock2 .chips.in button:nth-child(3){animation-delay:.06s}#dock2 .chips.in button:nth-child(4){animation-delay:.09s}#dock2 .chips.in button:nth-child(5){animation-delay:.12s}#dock2 .chips.in button:nth-child(6){animation-delay:.15s}#dock2 .chips.in button:nth-child(n+7){animation-delay:.18s}
@keyframes chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#dock2 .chips button{all:unset;cursor:pointer;font-size:13px;color:#e8e8ed;padding:7px 14px;border-radius:980px;white-space:nowrap;background:rgba(36,36,38,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);transition:background .25s,color .25s,border-color .25s}
#dock2 .chips button:hover{background:rgba(60,60,64,.7)}
#dock2 .chips button[aria-selected="true"]{background:rgba(41,151,255,.22);border-color:rgba(41,151,255,.6);color:#fff}
#dock2 button:focus-visible{outline:2px solid #2997ff;outline-offset:2px}

#dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:14;display:flex;flex-direction:column;gap:12px}
#dots button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:10px;height:14px}
#dots button::after{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);transition:transform .25s,background .25s}
#dots button span{font-size:11px;color:#8e8e93;opacity:0;transition:opacity .25s}
#dots button:hover span{opacity:1}
#dots button.on::after{background:#fff;transform:scale(1.5)}
body.exploring #dots{opacity:0;pointer-events:none}
@media (max-width:1100px) and (min-width:761px){#side{width:min(320px,34vw)}.ch .card{width:min(380px,40vw)}}
@media (max-width:760px){
  .ch{height:125vh}
  .ch .card{top:62vh;max-height:36vh;overflow:auto;margin-left:20px;width:calc(100vw - 40px);gap:8px}
  body.storying::before{background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 32%,rgba(0,0,0,0) 50%)}
  .ch.hero .card{top:9vh;max-height:none}
  .ch h2{font-size:28px}
  .ch p{font-size:14.5px}
  .ch .toc li{font-size:14px;grid-template-columns:22px 34px minmax(0,1fr) auto;padding:8px 0}
  #side{left:12px;right:12px;top:56px;width:auto;transform:translateY(-10px);max-height:30vh;padding:14px 16px 12px;gap:10px;border-radius:20px}
  #side.on{transform:none}
  #side .sb{font-size:26px}
  #side .chart{max-height:90px}
  .ch.last .card{display:none}
  #dots{display:none}
}

/* 開場：數字從地圖冒出來 */
#intro{position:fixed;inset:0;z-index:13;pointer-events:none;overflow:hidden}
#intro .ic{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:1px;opacity:0;white-space:nowrap;will-change:transform,opacity;text-shadow:0 1px 10px rgba(0,0,0,.7)}
#intro .ic b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#intro .ic b i{font-style:normal;font-weight:500;font-size:.72em;opacity:.85}
#intro .ic small{font-size:10.5px;color:#a1a1a6}
#intro .ic small em{font-style:normal;font-weight:600}
#intro .ic.halo{padding:5px 10px 6px;border-radius:12px;background:rgba(22,22,24,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08)}
#intro .ic.halo b{font-size:16px}
#intro .ic.top{z-index:2;background:rgba(22,22,24,.72);border-color:rgba(255,255,255,.22)}
#intro .ic.top b{font-size:22px}
body.intro .ch.hero .card{opacity:0!important;transform:translateY(14px)!important}
body.intro::before{opacity:.4}
.ch .herofoot{display:flex;align-items:center;gap:16px;margin-top:16px}
.ch .herofoot .scrollhint{margin-top:0}
.ch .replay{all:unset;cursor:pointer;font-size:12px;color:#2997ff}

function pickTop(all, n = 5) {

  for (const c of all.slice().sort((a, b) => b.score - a.score)) {

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<base href="/3d/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣此刻 · 劇本版（測試）</title>
<meta name="robots" content="noindex">
<meta name="description" content="立體的台灣：天氣、地震、房價、車流，和從海外流進來的錢。">
<meta name="theme-color" content="#000000">
<style>
:root{
  --bg:#000;--fg:#f5f5f7;--fg2:#a1a1a6;--fg3:#6e6e73;--line:rgba(255,255,255,.12);
  --glass:rgba(29,29,31,.62);--glass2:rgba(44,44,46,.55);--blue:#0071e3;--blue2:#2997ff;
  --up:#30d158;--down:#ff453a;--warn:#ffd60a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--blue2);text-decoration:none}
a:hover{text-decoration:underline}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 35%,#101216 0%,#050506 55%,#000 100%)}
canvas{display:block}

/* 導覽列 */
nav{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-left));z-index:20;
  background:rgba(22,22,23,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;letter-spacing:.01em}
nav .brand{font-weight:600;font-size:14px;color:var(--fg)}
nav .brand span{color:var(--fg2);font-weight:400;margin-left:6px}
nav .right{display:flex;gap:18px;align-items:center;color:var(--fg2)}
nav .right a{color:var(--fg2)}
nav .right a:hover{color:var(--fg);text-decoration:none}

/* 開場 */
#hero{position:fixed;top:88px;left:0;right:0;text-align:center;z-index:10;transition:opacity .9s ease,transform .9s ease;pointer-events:none}
#hero h1{font-size:clamp(40px,7vw,80px);font-weight:600;letter-spacing:-.015em;line-height:1.05}
#hero p{font-size:clamp(17px,2.1vw,24px);color:var(--fg2);margin-top:10px;font-weight:400;letter-spacing:.005em}
#hero .when{font-size:13px;color:var(--fg3);margin-top:14px;letter-spacing:.04em}
#hero .ctas{display:flex;gap:14px;justify-content:center;margin-top:22px;pointer-events:auto}
.pill{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 22px;border-radius:980px;font-size:15px;font-family:var(--font);cursor:pointer;border:1px solid transparent;transition:background .2s,color .2s,border-color .2s}
.pill.primary{background:var(--blue);color:#fff}
.pill.primary:hover{background:#0077ed;text-decoration:none}
.pill.ghost{background:transparent;color:var(--blue2);border-color:var(--blue2)}
.pill.ghost:hover{background:var(--blue2);color:#fff;text-decoration:none}
body.exploring #hero{opacity:0;transform:translateY(-24px)}
body.exploring #hero .ctas{pointer-events:none}

/* 圖層說明 */
#caption{position:fixed;left:max(16px,env(safe-area-inset-left));top:64px;z-index:10;max-width:440px;padding:12px 16px 14px;border-radius:18px;background:rgba(10,10,12,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
body.exploring #caption{opacity:1;transform:none}
#caption .eyebrow{font-size:12px;color:var(--fg3);letter-spacing:.08em}
#caption h2{font-size:32px;font-weight:600;letter-spacing:-.01em;margin-top:4px}
#caption .stat{font-size:15px;color:var(--fg2);margin-top:8px;line-height:1.55}
#caption .stat b{color:var(--fg);font-weight:600}
#caption .src{font-size:11px;color:var(--fg3);margin-top:10px}

/* 底部圖層切換 */
#dock{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:15;display:flex;gap:2px;padding:4px;border-radius:980px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--line);opacity:0;transition:opacity .6s ease .2s,transform .6s ease .2s;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
body.exploring #dock{opacity:1;transform:translate(-50%,0)}
#dock button{all:unset;cursor:pointer;font-size:14px;color:var(--fg2);padding:9px 18px;border-radius:980px;white-space:nowrap;transition:background .25s,color .25s}
#dock button:hover{color:var(--fg)}
#dock button.on{background:rgba(255,255,255,.14);color:var(--fg)}

/* 縣市卡片 */
#card{position:fixed;right:max(24px,env(safe-area-inset-right));top:72px;width:340px;max-height:calc(100vh - 160px);overflow:auto;z-index:16;padding:20px 20px 16px;border-radius:22px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);border:1px solid var(--line);
  opacity:0;transform:translateX(16px);pointer-events:none;transition:opacity .35s ease,transform .35s ease}
#card.show{opacity:1;transform:none;pointer-events:auto}
#card .x{all:unset;position:absolute;right:12px;top:10px;z-index:2;cursor:pointer;color:var(--fg2);font-size:22px;line-height:1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08)}
#card .x:hover{color:var(--fg);background:rgba(255,255,255,.16)}
#card h3{font-size:24px;font-weight:600;padding-right:40px}
#card .sub{font-size:13px;color:var(--fg2);margin-top:2px}
#card .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
#card .kv{background:var(--glass2);border-radius:14px;padding:10px 12px}
#card .kv .k{font-size:11px;color:var(--fg3);letter-spacing:.04em}
#card .kv .v{font-size:20px;font-weight:600;margin-top:2px}
#card .kv .v small{font-size:12px;font-weight:400;color:var(--fg2);margin-left:2px}
#card .sec{font-size:12px;color:var(--fg3);margin:16px 0 6px;letter-spacing:.06em}
#card ul{list-style:none}
#card li{font-size:14px;line-height:1.45;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
#card li .m{display:block;font-size:11px;color:var(--fg3);margin-top:2px}
#card .tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:980px;background:rgba(255,214,10,.15);color:var(--warn);margin:4px 6px 0 0}
#card .more{display:block;margin-top:14px;font-size:14px}

/* 地圖上的標籤 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;color:var(--fg);transition:opacity .4s;text-align:center;line-height:1.3;padding:3px 8px;border-radius:9px;background:rgba(20,20,22,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08)}
.lbl .n{font-size:11px;color:var(--fg2)}
.lbl.big{font-size:14px;font-weight:600}
.lbl.pillv{font-size:13px;font-weight:600}
.lbl.flow{font-size:13px;padding:6px 10px;border-radius:12px}
.lbl.flow .n{display:block}
.up{color:var(--up)!important}.down{color:var(--down)!important}

#hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);font-size:12px;color:var(--fg3);z-index:9;opacity:0;transition:opacity .6s ease 1s;pointer-events:none;white-space:nowrap}
body.exploring #hint{opacity:1}
#tip{position:fixed;z-index:25;pointer-events:none;padding:8px 12px;border-radius:12px;background:rgba(20,20,22,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);font-size:13px;line-height:1.4;opacity:0;transition:opacity .15s;max-width:260px}
#tip.show{opacity:1}#tip b{display:block;font-weight:600}#tip span{color:var(--fg2)}
#credit{position:fixed;right:12px;bottom:8px;font-size:10px;color:var(--fg3);z-index:9;opacity:.7;pointer-events:none}
@media (max-width:760px){#credit{display:none}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:#000;transition:opacity .8s ease;font-size:13px;color:var(--fg3);letter-spacing:.08em}
#load.done{opacity:0;pointer-events:none}
#fallback{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px;z-index:40;background:#000}

@media (max-width:760px){
  #hero{top:72px;padding:0 20px}
  #hero p{font-size:15px;text-wrap:balance}
  #caption{left:16px;right:16px;max-width:none;top:56px}
  #caption h2{font-size:24px}
  #caption .stat{font-size:13px}
  #card{left:8px;right:8px;width:auto;top:auto;bottom:84px;max-height:52vh;border-radius:20px;transform:translateY(16px)}
  #hint{display:none}
  nav .right .hide-s{display:none}
}
/* 捲動劇本：文字在左、台灣在中間、圖表在右 */
html,body{height:auto;overflow:visible}
html{overflow-x:clip}
#hero,#dock,#caption,#hint{display:none!important}
#story{position:relative;z-index:12;pointer-events:none}
.ch{height:135vh;position:relative}
.ch.last{height:100vh}
.ch .card{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.ch.act .card{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.ch .card{transition:none}}
.ch .card{position:sticky;top:24vh;margin-left:max(24px,5vw);width:min(440px,calc(100vw - 48px));pointer-events:auto;display:flex;flex-direction:column;gap:12px;text-shadow:0 1px 18px rgba(0,0,0,.55)}
body.storying::before{content:"";position:fixed;inset:0;z-index:11;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.74) 0%,rgba(0,0,0,.42) 28%,rgba(0,0,0,0) 52%)}
.ch .eyebrow{font-size:12px;color:#8e8e93;letter-spacing:.08em}
.ch h1{font-size:clamp(46px,6.6vw,88px);font-weight:700;letter-spacing:-.02em;line-height:1.02}
.ch h2{word-break:keep-all;font-size:clamp(32px,3.6vw,50px);font-weight:700;letter-spacing:-.015em;line-height:1.12}
.ch p{font-size:17px;line-height:1.65;color:#c7c7cc}
.ch .lede{font-size:clamp(19px,1.9vw,23px);color:#f5f5f7;font-weight:500}
.ch .why{font-size:13.5px;color:#8e8e93;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
.ch .why b{display:block;color:#c7c7cc;font-weight:500;margin-bottom:2px}
.ch.hero .card{top:12vh;width:min(600px,calc(100vw - 48px))}
.ch .toc{list-style:none;display:flex;flex-direction:column;margin-top:10px;border-top:1px solid rgba(255,255,255,.14)}
.ch .toc li{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px}
.ch .toc .n{font-size:12px;color:#6e6e73;font-variant-numeric:tabular-nums}
.ch .toc .c{font-size:12px;color:#8e8e93}
.ch .toc .t{font-weight:600;color:#f5f5f7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .toc .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ch .scrollhint{font-size:12px;color:#8e8e93;letter-spacing:.12em;margin-top:16px;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(6px);opacity:1}}
.ch .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.ch.last .card{top:auto;position:absolute;bottom:170px}

/* 圖表面板 */
#side{position:fixed;z-index:13;right:max(24px,4vw);top:50%;width:min(360px,30vw);transform:translate(16px,-50%);opacity:0;pointer-events:none;
  padding:20px 20px 16px;border-radius:24px;background:rgba(22,22,24,.62);backdrop-filter:saturate(170%) blur(26px);-webkit-backdrop-filter:saturate(170%) blur(26px);
  border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.45);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;max-height:72vh;overflow:auto}
#side.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#side .se{font-size:11px;color:#8e8e93;letter-spacing:.08em}
#side .st{font-size:17px;font-weight:600;color:#f5f5f7;margin-top:3px;line-height:1.35}
#side .sb{font-size:34px;font-weight:700;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
#side .sb small{font-size:14px;font-weight:500;color:#8e8e93;margin-left:8px}
#side .chart{width:100%;height:auto;display:block;overflow:visible}
#side .chart .grid{stroke:rgba(255,255,255,.08);stroke-dasharray:2 4}
#side .chart .ax{fill:#6e6e73;font-size:10px;font-family:var(--font);font-variant-numeric:tabular-nums}
#side .chart .dot{animation:pop .5s .9s both cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
#side .chart .dot{transform-box:fill-box;transform-origin:center}
#side .bars{display:flex;flex-direction:column;gap:7px}
#side .bar{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
#side .bn{color:#c7c7cc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .bt{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
#side .bt i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#side .bv{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
#side .lst{list-style:none;display:flex;flex-direction:column}
#side .lst li{font-size:13.5px;line-height:1.45;color:#f5f5f7;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
#side .lst li:first-child{border-top:0}
#side .lst li span{display:block;font-size:11.5px;color:#8e8e93;margin-top:2px}
#side .lst a{color:#f5f5f7}
#side .sf{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:#6e6e73;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
#side .empty{font-size:13px;color:#8e8e93}
@media (prefers-reduced-motion:reduce){#side .bt i,#side .chart .dot,.ch .scrollhint{animation:none}}
#leaderSvg{position:fixed;inset:0;width:100%;height:100%;z-index:12;pointer-events:none}
#leaderG{transition:opacity .4s}
#leader{stroke:rgba(255,255,255,.55);stroke-width:1}
#leaderDot{fill:#fff}

/* 自己逛：分類＋項目（像 iOS 的分段控制） */
#dock2{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,24px);z-index:15;display:flex;flex-direction:column;align-items:center;gap:10px;
  opacity:0;pointer-events:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1);width:min(760px,calc(100vw - 24px))}
body.exploring #dock2{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dock2 .seg{position:relative;display:flex;gap:0;padding:4px;border-radius:980px;background:rgba(36,36,38,.66);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.1);max-width:100%;overflow-x:auto;scrollbar-width:none}
#dock2 .seg::-webkit-scrollbar,#dock2 .chips::-webkit-scrollbar{display:none}
#dock2 .seg button{all:unset;position:relative;z-index:1;cursor:pointer;font-size:14px;font-weight:500;color:#a1a1a6;padding:9px 18px;border-radius:980px;white-space:nowrap;transition:color .3s}
#dock2 .seg button[aria-selected="true"]{color:#1d1d1f}
#dock2 .seg .hl{position:absolute;left:4px;top:4px;bottom:4px;border-radius:980px;background:#f5f5f7;transition:transform .45s cubic-bezier(.3,.9,.3,1),width .45s cubic-bezier(.3,.9,.3,1);box-shadow:0 2px 8px rgba(0,0,0,.25)}
#dock2 .chips{display:flex;gap:8px;max-width:100%;overflow-x:auto;padding:2px 6px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
#dock2 .chips.in button{animation:chip .5s cubic-bezier(.2,.8,.2,1) both}
#dock2 .chips.in button:nth-child(2){animation-delay:.03s}#dock2 .chips.in button:nth-child(3){animation-delay:.06s}#dock2 .chips.in button:nth-child(4){animation-delay:.09s}#dock2 .chips.in button:nth-child(5){animation-delay:.12s}#dock2 .chips.in button:nth-child(6){animation-delay:.15s}#dock2 .chips.in button:nth-child(n+7){animation-delay:.18s}
@keyframes chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#dock2 .chips button{all:unset;cursor:pointer;font-size:13px;color:#e8e8ed;padding:7px 14px;border-radius:980px;white-space:nowrap;background:rgba(36,36,38,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);transition:background .25s,color .25s,border-color .25s}
#dock2 .chips button:hover{background:rgba(60,60,64,.7)}
#dock2 .chips button[aria-selected="true"]{background:rgba(41,151,255,.22);border-color:rgba(41,151,255,.6);color:#fff}
#dock2 button:focus-visible{outline:2px solid #2997ff;outline-offset:2px}

#dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:14;display:flex;flex-direction:column;gap:12px}
#dots button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:10px;height:14px}
#dots button::after{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);transition:transform .25s,background .25s}
#dots button span{font-size:11px;color:#8e8e93;opacity:0;transition:opacity .25s}
#dots button:hover span{opacity:1}
#dots button.on::after{background:#fff;transform:scale(1.5)}
body.exploring #dots{opacity:0;pointer-events:none}
@media (max-width:1100px) and (min-width:761px){#side{width:min(320px,34vw)}.ch .card{width:min(380px,40vw)}}
@media (max-width:760px){
  .ch{height:125vh}
  .ch .card{top:62vh;max-height:36vh;overflow:auto;margin-left:20px;width:calc(100vw - 40px);gap:8px}
  body.storying::before{background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 32%,rgba(0,0,0,0) 50%)}
  .ch.hero .card{top:9vh;max-height:none}
  .ch h2{font-size:28px}
  .ch p{font-size:14.5px}
  .ch .toc li{font-size:14px;grid-template-columns:22px 34px minmax(0,1fr) auto;padding:8px 0}
  #side{left:12px;right:12px;top:56px;width:auto;transform:translateY(-10px);max-height:30vh;padding:14px 16px 12px;gap:10px;border-radius:20px}
  #side.on{transform:none}
  #side .sb{font-size:26px}
  #side .chart{max-height:90px}
  .ch.last .card{display:none}
  #dots{display:none}
}

/* 開場：數字從地圖冒出來 */
#intro{position:fixed;inset:0;z-index:13;pointer-events:none;overflow:hidden}
#intro .ic{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:1px;opacity:0;white-space:nowrap;will-change:transform,opacity;text-shadow:0 1px 10px rgba(0,0,0,.7)}
#intro .ic b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#intro .ic b i{font-style:normal;font-weight:500;font-size:.72em;opacity:.85}
#intro .ic small{font-size:10.5px;color:#a1a1a6}
#intro .ic small em{font-style:normal;font-weight:600}
#intro .ic.halo{padding:5px 10px 6px;border-radius:12px;background:rgba(22,22,24,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08)}
#intro .ic.halo b{font-size:16px}
#intro .ic.top{z-index:2;background:rgba(22,22,24,.72);border-color:rgba(255,255,255,.22)}
#intro .ic.top b{font-size:22px}
body.intro .ch.hero .card{opacity:0!important;transform:translateY(14px)!important}
body.intro::before{opacity:.4}
.ch .herofoot{display:flex;align-items:center;gap:16px;margin-top:16px}
.ch .herofoot .scrollhint{margin-top:0}
.ch .replay{all:unset;cursor:pointer;font-size:12px;color:#2997ff}
.ch .replay:hover{text-decoration:underline}
.ch .replay:focus-visible{outline:2px solid #2997ff;outline-offset:3px;border-radius:4px}

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const RAW = "https://raw.githubusercontent.com/v1endetta/intel-terminal/data/data/";
const ASSET_V = 8;   // 地形與材質檔有更新時加一，避免瀏覽器拿到舊檔
const MOBILE = matchMedia("(max-width:760px)").matches || /Mobi|Android/i.test(navigator.userAgent);
const EX = 6;                 // 高度誇張倍數
const LONC = 120.95, LATC = 23.65;
const KX = 111.32 * Math.cos(LATC * Math.PI / 180), KY = 110.57;   // 1 單位 = 1 公里
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (x, d = 1) => (x == null || isNaN(x)) ? "—" : Number(x).toFixed(d);
const sgn = x => x > 0 ? "+" : "";
const cls = x => x > 0 ? "up" : x < 0 ? "down" : "";
const norm = s => String(s || "").replace(/臺/g, "台");
const toXZ = (lon, lat) => [(lon - LONC) * KX, -(lat - LATC) * KY];

/* ---------- 基本場景 ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: !MOBILE, alpha: true, powerPreference: "high-performance" });
} catch (e) { $("fallback").style.display = "flex"; $("load").remove(); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
$("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 1100, 2800);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(MOBILE ? 50 : 38, innerWidth / innerHeight, 1, 6000);
camera.position.set(0, 1400, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 3; controls.maxDistance = 1600;
controls.maxPolarAngle = Math.PI * 0.46;
controls.autoRotate = !MOBILE; controls.autoRotateSpeed = 0.35;   // 手機直式畫面轉了會歪，開場不自轉
controls.enablePan = !MOBILE;

const sun = new THREE.DirectionalLight(0xffffff, 2.4);
scene.add(sun);
const amb = new THREE.HemisphereLight(0x8fa6c9, 0x0b0d10, 0.35);
scene.add(amb);

/* ---------- 太陽位置（台北） ---------- */
function sunPos(d = new Date()) {
  const rad = Math.PI / 180, lat = 25.04 * rad, lon = 121.56;
  const jd = d.getTime() / 864e5 + 2440587.5, n = jd - 2451545.0;
  const L = (280.46 + 0.9856474 * n) % 360, g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lam = (L + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad, eps = 23.439 * rad;
  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
  const gmst = (280.46061837 + 360.98564736629 * n) % 360;
  const ha = ((gmst + lon) * rad - ra);
  const el = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(lat) - Math.sin(lat) * Math.cos(ha));
  return { el, az };
}
const FORCE = new URLSearchParams(location.search).get("time");   // ?time=day / ?time=night 可強制白天或夜晚
function applySun() {
  let { el, az } = sunPos();
  if (FORCE === "day") { el = 0.9; az = 2.4; } else if (FORCE === "night") el = -0.6;
  uni.uNight.value = el > -0.05 ? 0 : 1;
  renderer.toneMappingExposure = el > -0.05 ? 1.0 : 0.85;
  const day = el > -0.05;
  const e = Math.max(el, 0.18);
  sun.position.set(Math.sin(az) * Math.cos(e) * 1000, Math.sin(e) * 1000, -Math.cos(az) * Math.cos(e) * 1000);
  IS_DAY = day;
  const real = !!DAY;
  if (day) { sun.color.set(el < 0.2 ? 0xffd2a1 : 0xffffff); sun.intensity = real ? 2.3 : 2.6; amb.intensity = real ? 0.55 : 0.35; if (terrainMat) { terrainMat.envMapIntensity = real ? 0.35 : 1.3; terrainMat.emissiveIntensity = 0; } }
  else { sun.position.set(-700, 380, -260); sun.color.set(0xaec2ff); sun.intensity = real ? 0.35 : 1.8; amb.intensity = real ? 0.08 : 0.2; if (terrainMat) { terrainMat.envMapIntensity = real ? 0.15 : 0.75; terrainMat.emissiveIntensity = real ? 1 : 0; } }
  const t = new Date().toLocaleTimeString("zh-TW", { timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit", hour12: false });
  $("clock").textContent = t + " 台北";
  $("when").textContent = (day ? (el < 0.2 ? "晨昏" : "白天") : "夜間") + " · " + t + " 台北 · 光線依實際太陽位置";
  return day;
}

/* ---------- 地形 ---------- */
let DEM, META, terrain, terrainMat, radarTex = null, DAY = null, NIGHT = null, LIGHTS = null, IS_DAY = true;
const uni = { uRadar: { value: 0 }, uRadarTex: { value: null }, uRadarB: { value: new THREE.Vector4(0, 0, 1, 1) }, uTime: { value: 0 }, uDim: { value: 0 }, uNight: { value: 0 }, uLights: { value: null }, uHasLights: { value: 0 }, uClose: { value: 0 }, uLightK: { value: 1 }, uScan: { value: 99 }, uScanOn: { value: 0 } };
let dimTo = 0;

function hAt(lon, lat) {   // 地表高度（場景單位）
  if (!DEM) return 0;
  const i = (lon - META.lon0) / (META.lon1 - META.lon0) * (META.w - 1), j = (META.lat1 - lat) / (META.lat1 - META.lat0) * (META.h - 1);
  if (i < 0 || j < 0 || i > META.w - 1 || j > META.h - 1) return 0;
  const e = DEM[Math.round(j) * META.w + Math.round(i)];
  return Math.max(e, 0) / 1000 * EX;
}

async function loadDEM() {
  META = await (await fetch("dem.json?v=" + ASSET_V)).json();
  const blob = await (await fetch("dem.png?v=" + ASSET_V)).blob();
  const bmp = await createImageBitmap(blob, { colorSpaceConversion: "none", premultiplyAlpha: "none" });
  const cv = document.createElement("canvas"); cv.width = bmp.width; cv.height = bmp.height;
  const cx = cv.getContext("2d", { willReadFrequently: true }); cx.drawImage(bmp, 0, 0);
  const px = cx.getImageData(0, 0, bmp.width, bmp.height).data;
  DEM = new Float32Array(META.w * META.h);
  for (let k = 0; k < DEM.length; k++) DEM[k] = (px[k * 4] * 256 + px[k * 4 + 1]) * META.scale + META.offset;
  if (META.tex) {   // 真實地面：NASA 白天衛星合成圖＋夜間燈光圖
    const L = new THREE.TextureLoader(), ld = u => new Promise(r => L.load(u, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); r(t); }, undefined, () => r(null)));
    [DAY, NIGHT, LIGHTS] = await Promise.all([ld("day.jpg?v=" + ASSET_V), ld("night.jpg?v=" + ASSET_V), META.tex.lights ? ld("lights.png?v=" + ASSET_V) : null]);
    if (LIGHTS) LIGHTS.colorSpace = THREE.NoColorSpace;
    uni.uLights.value = LIGHTS; uni.uHasLights.value = LIGHTS ? 1 : 0;
  }
}

function buildTerrain() {
  const S = MOBILE ? 3 : 2, W = Math.floor((META.w - 1) / S) + 1, H = Math.floor((META.h - 1) / S) + 1;
  const pos = new Float32Array(W * H * 3), el = new Float32Array(W * H), ll = new Float32Array(W * H * 2), uv = new Float32Array(W * H * 2);
  const dl = (META.lon1 - META.lon0) / (META.w - 1), dt = (META.lat1 - META.lat0) / (META.h - 1);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const k = j * W + i, lon = META.lon0 + i * S * dl, lat = META.lat1 - j * S * dt;
    let e = DEM[(j * S) * META.w + i * S]; if (lon < 119.95 && lat > 24.0) e = -1;   // 去掉角落的大陸沿岸
    const [x, z] = toXZ(lon, lat);
    pos[k * 3] = x; pos[k * 3 + 1] = Math.max(e, 0) / 1000 * EX; pos[k * 3 + 2] = z;
    el[k] = e; ll[k * 2] = lon; ll[k * 2 + 1] = lat;
    uv[k * 2] = (lon - META.lon0) / (META.lon1 - META.lon0); uv[k * 2 + 1] = (lat - META.lat0) / (META.lat1 - META.lat0);
  }
  const idx = [];
  for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {
    const a = j * W + i, b = a + 1, c = a + W, d = c + 1;
    if (el[a] > 0 || el[b] > 0 || el[c] > 0) idx.push(a, c, b);
    if (el[b] > 0 || el[c] > 0 || el[d] > 0) idx.push(b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("aElev", new THREE.BufferAttribute(el, 1));
  g.setAttribute("aLL", new THREE.BufferAttribute(ll, 2));
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  terrainMat = DAY
    ? new THREE.MeshStandardMaterial({ map: DAY, emissiveMap: NIGHT, emissive: 0xffc68a, emissiveIntensity: 0, metalness: 0, roughness: 0.88, envMapIntensity: 0.35 })
    : new THREE.MeshStandardMaterial({ color: 0x80858f, metalness: 0.86, roughness: 0.32, envMapIntensity: 1.25 });
  terrainMat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, uni);
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nattribute float aElev; attribute vec2 aLL; varying float vElev; varying vec2 vLL; uniform float uClose;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvElev = aElev; vLL = aLL; transformed.y *= mix(1.0, 0.42, uClose);");
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying float vElev; varying vec2 vLL; uniform float uRadar; uniform sampler2D uRadarTex; uniform vec4 uRadarB; uniform float uTime; uniform float uDim; uniform float uNight; uniform sampler2D uLights; uniform float uHasLights; uniform float uClose; uniform float uLightK; uniform float uScan; uniform float uScanOn;")
      .replace("#include <color_fragment>", "#include <color_fragment>\nfloat lum = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));\ndiffuseColor.rgb = mix(vec3(lum), diffuseColor.rgb, 0.8) * 1.3;\ndiffuseColor.rgb *= mix(1.0, 0.42, uDim);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.13, 0.14, 0.16) + diffuseColor.rgb * 0.12, uClose * 0.85);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.2, 0.27, 0.35), (1.0 - smoothstep(0.0, 2.0, vElev)) * 0.85 * uClose);\ndiffuseColor.rgb *= mix(vec3(1.0), vec3(0.16, 0.19, 0.27), uNight);")
      .replace("#include <clipping_planes_fragment>", "#include <clipping_planes_fragment>\nif (vElev < mix(0.0, -4.0, step(0.3, uClose))) discard;")
      .replace("#include <emissivemap_fragment>", `#include <emissivemap_fragment>
        {   // 夜光：NASA 夜光的形狀 × OSM 樓地板密度（大城市核心更亮）
          float nl = clamp(dot(totalEmissiveRadiance, vec3(0.3333)), 0.0, 1.0);
          #ifdef USE_MAP
          float dens = uHasLights > 0.5 ? texture2D(uLights, vMapUv).r : nl;
          #else
          float dens = nl;
          #endif
          float I = clamp(pow(dens, 0.9) + 0.1 * nl * nl, 0.0, 1.0);
          vec2 cell = floor(vLL * 300.0);
          float n = fract(sin(dot(cell, vec2(12.9898, 78.233))) * 43758.5453);
          float spark = step(1.0 - I * 0.9, n);
          vec3 lc = mix(vec3(1.0, 0.5, 0.16), vec3(1.0, 0.9, 0.74), I);
          totalEmissiveRadiance = lc * (spark * (0.12 + 1.9 * I) + pow(I, 2.0) * 1.1) * uNight * (1.0 - smoothstep(0.25, 0.85, uClose)) * uLightK;   // 拉近時交給建物窗戶發光
        }
        // 高度帶：極淡的等高線，讓山形更清楚
        float band = abs(fract(vElev / 500.0) - 0.5);
        totalEmissiveRadiance += vec3(0.55, 0.62, 0.75) * smoothstep(0.03, 0.0, band) * 0.03 * step(80.0, vElev);
        if (uRadar > 0.0) {
          vec2 ruv = vec2((vLL.x - uRadarB.x) / (uRadarB.z - uRadarB.x), (vLL.y - uRadarB.y) / (uRadarB.w - uRadarB.y));
          vec4 rc = texture2D(uRadarTex, ruv);
          totalEmissiveRadiance += rc.rgb * rc.a * 1.6 * uRadar;
          diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 0.55, rc.a * uRadar);
        }
        if (uScanOn > 0.001) {
          float sd = vLL.y - uScan, hid = smoothstep(-0.01, 0.06, sd) * uScanOn;
          diffuseColor.rgb *= 1.0 - hid * 0.94; totalEmissiveRadiance *= 1.0 - hid;
          vec2 gq = abs(fract(vLL * 12.0) - 0.5); float gline = smoothstep(0.035, 0.0, min(gq.x, gq.y));
          float cline = smoothstep(0.06, 0.0, abs(fract(vElev / 300.0) - 0.5)) * step(30.0, vElev);
          totalEmissiveRadiance += vec3(0.22, 0.7, 1.0) * (gline * 0.22 + cline * 0.55) * hid;
          totalEmissiveRadiance += vec3(0.45, 0.9, 1.0) * (exp(-pow(sd / 0.015, 2.0)) * 1.25 + exp(min(sd, 0.0) / 0.25) * step(sd, 0.0) * 0.12) * uScanOn;
        }`);
  };
  terrain = new THREE.Mesh(g, terrainMat);
  scene.add(terrain);

  // 海面：深色，經緯網格
  const cv = document.createElement("canvas"); cv.width = cv.height = 1024;
  const c = cv.getContext("2d"); c.fillStyle = "#040507"; c.fillRect(0, 0, 1024, 1024);
  c.strokeStyle = "rgba(160,175,200,.16)"; c.lineWidth = 1.2;
  for (let k = 0; k <= 16; k++) { const p = k * 64; c.beginPath(); c.moveTo(p, 0); c.lineTo(p, 1024); c.stroke(); c.beginPath(); c.moveTo(0, p); c.lineTo(1024, p); c.stroke(); }
  const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(15, 15); tex.colorSpace = THREE.SRGBColorSpace;
  const sea = new THREE.Mesh(new THREE.CircleGeometry(4200, 128), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.95, fog: true }));
  sea.rotation.x = -Math.PI / 2; sea.position.y = -0.4;
  // 每格約 0.5 度：對齊經緯度
  sea.material.map.offset.set(0, 0);
  scene.add(sea);
}

/* ---------- 縣市 ---------- */
let COUNTIES = [];   // {name, rings:[[ [lon,lat],...]], c:[lon,lat], bbox}
const outlineGroup = new THREE.Group(); scene.add(outlineGroup);
let hoverLine = null;
function ringLine(r, mat, lift = 0.25) {
  const pts = [];

function placeLabels() {
  const vis = [];

    if (!L.on) { L.el.style.opacity = 0; continue; }
    L.sx = (_v.x + 1) / 2 * innerWidth; L.sy = (1 - _v.y) / 2 * innerHeight;

// 地震：震央漣漪＋震源深度

    const [x, z] = toXZ(q.lon, q.lat), y = hAt(q.lon, q.lat) + 0.6;

    for (let k = 0; k < 3; k++) {
      const m = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 64), new THREE.MeshBasicMaterial({ color: col, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
      m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); g.add(m);
      rings.push({ m, ph: k / 3 + i * 0.13, R: 8 + q.mag * 6 * (i === 0 ? 1.4 : 1) });

  };

}

// 車流：國道路段，流速＝車速
function setupTraffic() {
  const g = layerGroup("traffic");
  if (!ROADS_GEO || !ROADS_LIVE) { layers.traffic.on = () => caption("車流", "路況資料暫時讀不到", "", ""); layers.traffic.off = () => { }; return; }
  const fw = ROADS_GEO.fw, sp = ROADS_LIVE.fw || [];
  const pos = [], col = [], dist = [], spd = [];
  let slow = 0, sum = 0, n = 0; const jams = [];
  const C = new THREE.Color();
  fw.c.forEach((flat, i) => {
    const s = sp[i]; if (s == null || s < 0) return;
    sum += s; n++; if (s < 40) { slow++; jams.push([fw.n[i], s, flat]); }
    C.setHex(s >= 80 ? 0x30d158 : s >= 50 ? 0xffd60a : 0xff453a);
    let d = 0;
    for (let k = 0; k + 3 < flat.length; k += 2) {
      const a = [flat[k] / 1e4, flat[k + 1] / 1e4], b = [flat[k + 2] / 1e4, flat[k + 3] / 1e4];
      const [ax, az] = toXZ(...a), [bx, bz] = toXZ(...b), ay = hAt(...a) + 1.6, by = hAt(...b) + 1.6;
      const seg = Math.hypot(bx - ax, bz - az);
      pos.push(ax, ay, az, bx, by, bz); col.push(C.r, C.g, C.b, C.r, C.g, C.b); dist.push(d, d + seg); spd.push(s, s); d += seg;
    }

  geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute("aDist", new THREE.Float32BufferAttribute(dist, 1));
  geo.setAttribute("aSpd", new THREE.Float32BufferAttribute(spd, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: uni.uTime }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute float aDist; attribute float aSpd; attribute vec3 color; varying float vD; varying float vS; varying vec3 vC;
      void main(){ vD=aDist; vS=aSpd; vC=color; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform float uTime; varying float vD; varying float vS; varying vec3 vC;
      void main(){ float f=fract(vD*0.45 - uTime*vS*0.02); float a=0.25+0.75*smoothstep(0.55,0.95,f); gl_FragColor=vec4(vC*2.2,a); }`
  });
  g.add(new THREE.LineSegments(geo, mat));
  layers.traffic.on = () => {
    jams.sort((a, b) => a[1] - b[1]).slice(0, 3).forEach(([nm, s, flat]) => {

      addLabel(`${s} km/h<span class="n"> ${esc(nm.replace(/^國道/, "國"))}</span>`, new THREE.Vector3(x, hAt(lon, lat) + 4, z), "", "traffic");
    });

      `${n} 個路段平均 <b>${fmt(sum / Math.max(n, 1), 0)} km/h</b>，低於 40 的有 <b>${slow}</b> 段<br>光點流得越快，車開得越快`, "交通部高公局 · " + (ROADS_LIVE.at ? ROADS_LIVE.at.slice(11, 16) : ""));
  };

// 資金流：海外市場 → 台灣，看傳導卡在哪
function setupFlow() {
  const g = layerGroup("flow");
  const W = Object.fromEntries(((P.world || {}).items || []).map(x => [x.sym, x]));
  const T = ((P.pulse || {}).items || []).find(x => x.sym === "^TWII") || {};
  const usd = ((P.fx || {}).items || []).find(x => x.code === "USD") || {};
  const inst = (((P.tw_market || {}).institutions || {}).items || []).find(x => x.name === "外資") || {};
  const tw = T.chg_pct;
  const [tx, tz] = toXZ(121.56, 25.04); const target = new THREE.Vector3(tx, hAt(121.56, 25.04) + 2, tz);
  const SRC = [
    { k: "^GSPC", label: "美股 S&P 500", bearing: 80, dist: 640 },
    { k: "^N225", label: "日經 225", bearing: 35, dist: 560 },
    { k: "000001.SS", label: "上證", bearing: 320, dist: 520 },
    { k: "^STOXX50E", label: "歐股 STOXX 50", bearing: 275, dist: 620 },
  ].map(s => ({ ...s, chg: (W[s.k] || {}).chg_pct })).filter(s => s.chg != null);
  const flows = [];
  for (const s of SRC) {
    const b = s.bearing * Math.PI / 180, o = new THREE.Vector3(tx + Math.sin(b) * s.dist, 0, tz - Math.cos(b) * s.dist);
    const mid = o.clone().lerp(target, 0.5); mid.y = s.dist * 0.32;
    const curve = new THREE.QuadraticBezierCurve3(o, mid, target);
    const stuck = tw != null && Math.sign(s.chg) !== Math.sign(tw) && Math.abs(s.chg) > 0.15;
    const color = s.chg >= 0 ? 0x30d158 : 0xff453a;
    const pts = curve.getPoints(80);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 96, 2.2, 8, false), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.75, depthWrite: false, fog: false })));
    const N = 46, pg = new THREE.BufferGeometry(), arr = new Float32Array(N * 3); pg.setAttribute("position", new THREE.BufferAttribute(arr, 3));
    const pm = new THREE.PointsMaterial({ color, size: MOBILE ? 6 : 5, sizeAttenuation: false, transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
    g.add(new THREE.Points(pg, pm));
    const dot = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), new THREE.MeshBasicMaterial({ color, fog: false })); dot.position.copy(o); g.add(dot);
    let block = null;
    if (stuck) { block = new THREE.Mesh(new THREE.TorusGeometry(12, 2.4, 12, 40), new THREE.MeshBasicMaterial({ color: 0xff453a, fog: false })); block.position.copy(curve.getPoint(0.82)); block.lookAt(curve.getPoint(0.84)); g.add(block); }
    flows.push({ s, curve, arr, pg, stuck, o, block, speed: 0.12 + Math.min(Math.abs(s.chg), 2) * 0.08 });
  }
  const glow = new THREE.Mesh(new THREE.SphereGeometry(6, 24, 16), new THREE.MeshBasicMaterial({ color: tw >= 0 ? 0x30d158 : 0xff453a, transparent: true, opacity: 0.9 }));
  glow.position.copy(target); g.add(glow);
  layers.flow.tick = t => {
    for (const f of flows) {
      const N = f.arr.length / 3;
      for (let i = 0; i < N; i++) {
        let p = (i / N + t * f.speed) % 1;
        if (f.stuck) p *= 0.82;   // 卡住：粒子到這裡就停
        const v = f.curve.getPoint(p); f.arr[i * 3] = v.x; f.arr[i * 3 + 1] = v.y; f.arr[i * 3 + 2] = v.z;
      }
      f.pg.attributes.position.needsUpdate = true;
      if (f.block) f.block.scale.setScalar(1 + 0.15 * Math.sin(t * 5));
    }
    glow.scale.setScalar(1 + 0.25 * Math.sin(t * 3));
  };
  layers.flow.on = () => {
    for (const f of flows) addLabel(`${esc(f.s.label)}<span class="n ${cls(f.s.chg)}">${sgn(f.s.chg)}${fmt(f.s.chg, 2)}%</span>`, f.o.clone().add(new THREE.Vector3(0, 14, 0)), "flow", "flow");
    addLabel(`台股加權<span class="n ${cls(tw)}">${sgn(tw)}${fmt(tw, 2)}%</span><span class="n">外資 ${inst.net != null ? (inst.net > 0 ? "買超 " : "賣超 ") + fmt(Math.abs(inst.net), 0) + " 億" : "—"}</span>`, target.clone().add(new THREE.Vector3(0, 16, 0)), "flow", "flow");
    const st = flows.filter(f => f.stuck);
    caption("資金流 · 海外 → 台灣", st.length ? `卡在台灣這一端` : "海外的方向，台股跟上了",
      st.length ? `${st.map(f => esc(f.s.label.split(" ")[0]) + ` <span class="${cls(f.s.chg)}">${sgn(f.s.chg)}${fmt(f.s.chg, 2)}%</span>`).join("、")}，台股卻 <b class="${cls(tw)}">${sgn(tw)}${fmt(tw, 2)}%</b>` +
        (inst.net != null ? `<br>外資${inst.net > 0 ? "買超" : "賣超"} <b>${fmt(Math.abs(inst.net), 0)} 億</b>，美元兌台幣 <b>${fmt(usd.mid, 2)}</b>` : "") + `<br>紅圈＝傳導斷在這裡`
        : `台股 <b class="${cls(tw)}">${sgn(tw)}${fmt(tw, 2)}%</b>，與主要海外市場同方向` + (inst.net != null ? `<br>外資${inst.net > 0 ? "買超" : "賣超"} <b>${fmt(Math.abs(inst.net), 0)} 億</b>` : ""),
      "收盤資料 · 線條顏色＝該市場漲跌");
    flyTo(new THREE.Vector3(tx + 120, MOBILE ? 1100 : 760, tz + (MOBILE ? 1150 : 900)), new THREE.Vector3(tx + 20, 40, tz - 120));
  };
  layers.flow.off = () => { clearLabels("flow"); flyTo(HOME.pos, HOME.tgt); };
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; controls.autoRotate = false; });
renderer.domElement.addEventListener("pointerup", e => {

function pickTop(all, n = 5) {
  const top = [], usedG = new Set();
  for (const c of all.slice().sort((a, b) => b.score - a.score)) {
    if (!(c.cat === "市場" || c.cat === "總經") || usedG.has(c.grp)) continue;
    top.push(c); usedG.add(c.grp); if (top.length >= n) break;
  }
  return top;
}

/* ---- 開場動畫：整座島冒出情報站的數字，最後收成五件事 ----

function introChips() {

  for (const c of (((P.elect || {}).cities) || [])) { const POS = { "台北": [121.56, 25.06], "新北": [121.45, 24.99], "桃園": [121.3, 24.98], "台中": [120.68, 24.15], "台南": [120.22, 23.0], "高雄": [120.32, 22.64] }, top = (c.cands || []).slice().sort((a, b) => b.p - a.p)[0];
    if (top && POS[c.city]) add({ geo: [POS[c.city][0] + 0.05, POS[c.city][1] + 0.05], v: top.p, dec: 0, unit: "%", lab: top.name, color: NEU }); }
  { const d = (P.airport || {}).dep || {}; if (d.total) add({ geo: [121.233, 25.077], v: d.total, dec: 0, unit: " 班", lab: "桃機離境", color: NEU }); }
  { const r = (P.power || {}).reserve_pct; if (r != null) add({ geo: [120.48, 24.21], v: r, dec: 1, unit: "%", lab: "備轉", color: r < 10 ? "#ff9f0a" : UPH }); }
  const q = (((P.quake || {}).items) || [])[0]; if (q && isFinite(q.mag)) add({ geo: [q.lon, q.lat], v: q.mag, dec: 1, unit: "", pre: "M", lab: "地震", color: YLH });

  for (const t of pool) { if (halo.length >= (MOBILE ? 16 : 26)) break; if (seen.has(t) || !isFinite(t.value)) continue; if (halo.filter(h => h.grp === t.grp).length >= 2) continue; halo.push(t); seen.add(t); }

      unit: t.iunit != null ? t.iunit : t.grp === "inst" ? " 億" : "", lab: t.name, chg: t.chgTxt, color: t.color, top: isTop ? (ST.top || []).indexOf(t) : -1, halo: true });

function buildIntro() {

/* ---- 科技感：掃描線、HUD 讀數、資料連線 ---- */
const HUD = { cv: null, cx: null };

/* ---------- 發光後製：亮的東西（掃描線、燈光、資料線、窗戶）暈開；手機用半解析度 ---------- */

addEventListener("resize", () => { if (composer) { composer.setSize(innerWidth, innerHeight); bloom.resolution.set(innerWidth * (MOBILE ? 0.5 : 1), innerHeight * (MOBILE ? 0.5 : 1)); } });

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

(async () => {

# 情報站網站：intel.daltatw.com（Cloudflare Worker＋靜態檔，前面有 Cloudflare Access）
name = "intel-terminal"
main = "worker/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/data/*", "/feed/*", "/s/*"]

[[routes]]
pattern = "intel.daltatw.com"
custom_domain = true

# 資料放在 Workers KV；id 由 deploy-site 部署時自動填入（查不到就建立）
[[kv_namespaces]]
binding = "DATA"
id = "__KV_ID__"

# 晨報通道與分享連結的金鑰只放「雜湊值」：公開也推不回金鑰（金鑰本身不在任何地方的程式碼裡）
# 要作廢分享連結：換一組新金鑰、把 SHARE_HASH 換成新雜湊再部署；設成 "off" 則關閉
[vars]
FEED_HASH = "69db21d64495635cd81fd4dd6fce4a6bf790a897d9dba0e9a789543071ebda87"
SHARE_HASH = "cbabf037a380b521d6e23cf3cfef77c9e97f4873f606296b0ed0ffe2827d73fd"

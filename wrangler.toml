# 情報站網站：intel.daltatw.com（Cloudflare Worker＋靜態檔，前面有 Cloudflare Access）
name = "intel-terminal"
main = "worker/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/data/*", "/feed/*", "/s/*"]

[[routes]]
pattern = "intel.daltatw.com"
custom_domain = true

# 資料放在 Workers KV；id 由 deploy-site 部署時自動填入（查不到就建立）
[[kv_namespaces]]
binding = "DATA"
id = "__KV_ID__"

# 分享連結版本：改成 "2" 再部署，舊連結立刻失效（新連結由 FEED_KEY 推算）；改成 "off" 關閉分享
[vars]
SHARE_VER = "1"

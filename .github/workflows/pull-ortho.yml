name: pull-ortho

# 一次性：把 Cloud Shell 烤好、放在 Google Cloud 儲存空間的航照，搬進網站（3d/ortho/）。
on:
  push:
    branches: [main]
    paths: [.github/workflows/pull-ortho.yml]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/896764575828/locations/global/workloadIdentityPools/github/providers/intel-terminal
          service_account: intel-writer@intel-vault-510704.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Download
        run: |
          mkdir -p 3d
          gcloud storage cp -r gs://intel-vault-510704-vault/bake/ortho 3d/
          ls 3d/ortho | head; du -sh 3d/ortho
      - name: Commit
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add 3d/ortho
          git diff --cached --quiet && exit 0
          git commit -qm "3d：預先烘焙的航空正射影像（國土測繪中心，五都市中心）"
          for i in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done; exit 1

name: pull-ortho

# 一次性：把 Cloud Shell 烤好、放在 Google Cloud 儲存空間的航照，搬進網站（3d/ortho/）。
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/896764575828/locations/global/workloadIdentityPools/github/providers/intel-terminal
          service_account: intel-writer@intel-vault-510704.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Download
        run: |
          mkdir -p /tmp/dl
          gcloud storage cp -r gs://intel-vault-510704-vault/bake/ortho /tmp/dl/ || { echo "::error::Cloud Storage 裡沒有 bake/ortho（還沒上傳完？）"; exit 1; }
          du -sh /tmp/dl/ortho
          # 索引裡列的每一塊（電腦版＋手機版）都要在，才算上傳完整；不完整就什麼都不動
          python3 - <<'PY'
          import json, os, sys
          R = "/tmp/dl/ortho"; d = json.load(open(f"{R}/index.json"))
          b = d.get("base", {}).get("chunks", []); c = d["cities"]
          need = [f"{R}/base/{q['id']}{v}.jpg" for q in b for v in ("", "_m")] + [f"{R}/{k}/{q['id']}{v}.jpg" for k, qs in c.items() for q in qs for v in ("", "_m")]
          miss = [p for p in need if not os.path.exists(p) or os.path.getsize(p) == 0]
          msg = f"全島 {len(b)} 塊，城市 {len(c)} 個，檔案 {len(need) - len(miss)}/{len(need)}"
          ok = not miss and len(b) > 30 and len(c) >= 17
          print(("::notice::" if ok else "::error::不完整，沒有動網站 → ") + msg)
          sys.exit(0 if ok else 1)
          PY
          rm -rf 3d/ortho && mv /tmp/dl/ortho 3d/ortho
      - name: Commit
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add 3d/ortho
          git diff --cached --quiet && exit 0
          git commit -qm "3d：航空正射影像（國土測繪中心）：17 個市中心 z16＋全島 z14 底圖"
          ok=0; for i in 1 2 3; do git push -q origin HEAD:main && { ok=1; break; }; git pull -q --rebase origin main; done; [ $ok = 1 ]
      - name: Clean up bucket
        run: gcloud storage rm -r -q gs://intel-vault-510704-vault/bake/ortho || echo "暫存刪除失敗，請手動刪"

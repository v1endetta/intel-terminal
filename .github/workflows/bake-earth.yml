name: bake-earth

# 一次性：抓 NASA 整顆地球的白天與夜間圖（開場動畫用）。
on:
  push:
    branches: [main]
    paths: [.github/workflows/bake-earth.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python ops/bake_earth.py
      - name: Commit
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add 3d/earth_*.jpg
          git diff --cached --quiet && exit 0
          git commit -qm "3d：整顆地球的白天與夜間圖（NASA GIBS，開場動畫用）"
          for i in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done; exit 1

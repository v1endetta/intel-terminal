name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python probe.py 2> log.txt || true
      - run: mkdir -p out5 && cp log.txt out5/
      - run: |
          git config user.name intel-bot; git config user.email intel-bot@users.noreply.github.com
          git add out5; git commit -qm "probe results"; git push -q origin HEAD:probe

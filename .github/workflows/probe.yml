name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python probe.py
      - run: |
          git config user.name intel-bot; git config user.email intel-bot@users.noreply.github.com
          git add out2; git commit -qm "probe results"; git push -q origin HEAD:probe

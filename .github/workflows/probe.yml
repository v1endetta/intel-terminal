name: probe（暫時）
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python ops/probe.py /tmp/out
      - name: 推到 probe-out
        run: |
          cd /tmp/out && git init -q && git checkout -q -b probe-out
          git config user.name intel-bot && git config user.email intel-bot@users.noreply.github.com
          git add -A && git commit -qm "probe $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out

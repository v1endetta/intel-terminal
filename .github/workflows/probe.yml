name: probe
# 暫時探測（美債殖利率來源），結果推到 probe-out 分支；用完刪掉這個檔與 ops/probe.py
on:
  push:
    branches: [main]
    paths: [ops/probe.py, .github/workflows/probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ops/probe.py /tmp/probe
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: push results
        env:
          FK: ${{ secrets.FRED_API_KEY }}
        run: |
          cd /tmp/probe
          if [ -n "$FK" ] && grep -rqF "$FK" .; then echo "secret found, abort"; exit 1; fi
          git init -q -b probe-out
          git config user.name "intel-bot"; git config user.email "intel-bot@users.noreply.github.com"
          git add -A && git commit -qm "probe $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out

name: bake-city

# 一次性：從 OpenStreetMap 重烤城市建物（白模＋精細外形、道路、水域綠地）。烤完就刪掉這個流程。
on:
  push:
    branches: [main]
    paths: [ops/bake_buildings.py, .github/workflows/bake-city.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium
      - run: python ops/bake_buildings.py
      - run: python ops/bake_city.py
      - run: ls -la 3d/*_taipei.bin 3d/*_tainan.bin 3d/*_kaohsiung.bin && python -c "import json; m=json.load(open('3d/buildings.json')); [print(k, v['n'], v['pn']) for k, v in m['cities'].items()]"
      - name: Commit
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add 3d/b_*.bin 3d/p_*.bin 3d/r_*.bin 3d/a_*.bin 3d/buildings.json
          git diff --cached --quiet && exit 0
          git commit -qm "3d：雙北、台南、高雄建物範圍擴大（OSM）"
          for i in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done; exit 1

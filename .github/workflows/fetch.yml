name: fetch

# 程式碼在 main，資料 commit 到 data 分支；main 不動就不會觸發 Pages 重建。
# GitHub schedule 實測會延遲到每 3 小時，所以用長跑迴圈，schedule 只當看門狗。
# 同一時間只允許一條迴圈：用原生 concurrency 排隊，新 run 等舊 run 結束才開始。

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: out
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Fetch loop
        env:
          INTEL_DATA_DIR: ${{ github.workspace }}/out/data
          GITHUB_TOKEN: ${{ github.token }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          cd out
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          # 壓平：data 分支超過 2000 個 commit 就用目前內容重新開一條
          if [ "$(git rev-list --count HEAD)" -gt 2000 ]; then
            git checkout -q --orphan squashed
            git add -A && git commit -qm "data: squash $(date -u +'%Y-%m-%d')"
            git branch -M data
            git push -q -f origin data
          fi
          start=$(date +%s); budget=$((300*60))   # 迴圈預算 5 小時，留 50 分給最後一輪與收尾
          while :; do
            # 每輪先同步到遠端最新（含你手改的 macro.json），任何殘留的 rebase 一律放棄
            git rebase --abort 2>/dev/null || true
            git fetch -q origin data && git reset -q --hard origin/data
            if (cd .. && timeout 600 python fetch.py); then
              # 金鑰防線：任何 secret 的實際值若出現在要 commit 的資料裡，整輪丟棄
              leak=0
              for v in "$FRED_API_KEY" "$FINMIND_TOKEN" "$REDDIT_CLIENT_ID" "$REDDIT_CLIENT_SECRET" "$CWA_API_KEY" "$TDX_CLIENT_ID" "$TDX_CLIENT_SECRET" "$GUARDIAN_API_KEY"; do
                [ -n "$v" ] && grep -rqF -- "$v" data && leak=1
              done
              if [ "$leak" = 1 ]; then echo "::error::secret value found in data output; round discarded"; git checkout -q -- data; git clean -fdq data
              else git add data; fi
            else
              echo "fetch.py failed or timed out; discarding this round"
              git checkout -q -- data; git clean -fdq data
            fi
            if ! git diff --cached --quiet; then
              git commit -qm "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
              git push -q origin data || { echo "push rejected, dropping this round"; git reset -q --hard origin/data; }
            fi
            h=$(date -u +%H); d=$(date -u +%u)
            if [ "$d" -le 5 ] && { [ "$h" -ge 1 -a "$h" -lt 6 ] || [ "$h" -ge 13 -a "$h" -lt 21 ]; }; then s=300; else s=900; fi
            [ $(( $(date +%s) + s - start )) -lt "$budget" ] || break
            echo "next fetch in ${s}s"
            sleep "$s"
          done
      - name: Start next loop
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run fetch.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep 30
          done
          echo "could not dispatch next loop; hourly cron will pick it up"

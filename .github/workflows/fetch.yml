name: fetch

# 程式碼在 main，資料 commit 到 data 分支：main 不動就不會觸發 Pages 重建，
# 避開 Pages 每小時 10 次部署的限制；data 分支太長時自動壓平。
# GitHub 的 schedule 實測會延遲到每 3 小時才觸發，所以用長跑迴圈，schedule 只當看門狗。

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Skip if another loop is already running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fetch.yml --status in_progress --json databaseId --jq 'map(select(.databaseId != '"$GITHUB_RUN_ID"')) | length')
          echo "other running loops: $n"
          if [ "$n" -gt 0 ]; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          ref: data
          path: out
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: env.SKIP != '1'
      - name: Fetch loop
        if: env.SKIP != '1'
        env:
          INTEL_DATA_DIR: ${{ github.workspace }}/out/data
          GITHUB_TOKEN: ${{ github.token }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          cd out
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          # 壓平：data 分支超過 2000 個 commit 就用目前內容重新開一條
          if [ "$(git rev-list --count HEAD)" -gt 2000 ]; then
            git checkout -q --orphan squashed
            git add -A && git commit -qm "data: squash $(date -u +'%Y-%m-%d')"
            git branch -M data
            git push -q -f origin data
          fi
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            (cd .. && python fetch.py) || true
            git add data
            if ! git diff --cached --quiet; then
              git commit -qm "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
              git pull -q --rebase origin data || true
              git push -q origin data || (git pull -q --rebase origin data && git push -q origin data) || true
            fi
            h=$(date -u +%H); d=$(date -u +%u)
            if [ "$d" -le 5 ] && { [ "$h" -ge 1 -a "$h" -lt 6 ] || [ "$h" -ge 13 -a "$h" -lt 21 ]; }; then s=300; else s=900; fi
            echo "next fetch in ${s}s"
            sleep "$s"
          done
      - name: Start next loop
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fetch.yml --repo "$GITHUB_REPOSITORY" --ref main

name: fetch

# GitHub 的排程觸發實測會延遲到每 3 小時才跑一次，所以改成「長跑迴圈」：
# 一次 job 內每 5 分鐘（盤中）或 15 分鐘（盤外）抓一次並 commit，跑滿約 5.5 小時後
# 自己再觸發下一輪。schedule 只當看門狗：若沒有迴圈在跑就補啟動。

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Skip if another loop is already running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fetch.yml --status in_progress --json databaseId --jq 'map(select(.databaseId != '"$GITHUB_RUN_ID"')) | length')
          echo "other running loops: $n"
          if [ "$n" -gt 0 ]; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: env.SKIP != '1'
      - name: Fetch loop
        if: env.SKIP != '1'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python fetch.py || true
            git add data
            if ! git diff --cached --quiet; then
              git commit -qm "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
              git pull -q --rebase --autostash origin main || true
              git push -q || (git pull -q --rebase origin main && git push -q) || true
            fi
            h=$(date -u +%H); d=$(date -u +%u)
            if [ "$d" -le 5 ] && { [ "$h" -ge 1 -a "$h" -lt 6 ] || [ "$h" -ge 13 -a "$h" -lt 21 ]; }; then s=300; else s=900; fi
            echo "next fetch in ${s}s"
            sleep "$s"
          done
      - name: Start next loop
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fetch.yml --repo "$GITHUB_REPOSITORY" --ref main

name: probe-strait
on:
  push:
    branches: [probe-strait]
    paths: ["probe/strait_probe.py", ".github/workflows/probe-strait.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pypdf
      - run: python probe/strait_probe.py | tee probe/result.txt
      - run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe/result.txt && git commit -m "probe result" && git push

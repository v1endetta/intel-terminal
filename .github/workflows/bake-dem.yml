name: bake-dem

# 一次性：烤 3D 頁面用的台灣高程圖（公開資料、免金鑰），寫進 main 的 3d/ 資料夾。
on:
  push:
    branches: [main]
    paths: [ops/bake_dem.py, .github/workflows/bake-dem.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python ops/bake_dem.py
      - name: Commit
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add 3d/dem.png 3d/dem.json
          git diff --cached --quiet && exit 0
          git commit -qm "3d：台灣高程圖（Terrarium z9）"
          for i in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done; exit 1

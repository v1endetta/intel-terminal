name: bake-lights

# 一次性：重抓 NASA 夜光圖、用 OpenStreetMap 建物算城市密度，給 3D 頁面的夜景用。
on:
  push:
    branches: [main]
    paths: [ops/bake_lights.py, .github/workflows/bake-lights.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy osmium
      - run: python ops/bake_lights.py
      - name: Commit
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add 3d/night.jpg 3d/lights.png 3d/dem.json
          git diff --cached --quiet && exit 0
          git commit -qm "3d：夜光原圖＋OSM 城市密度圖"
          for i in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done; exit 1
